<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="claude:viewport-fit-sides" content="cover">
<title>HarBEST!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Pixelify+Sans:wght@500;700&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/pyodide@0.26.4/pyodide.js"></script>
<style>
/* v3 kit: tokens, chunky pixel-style buttons (2px border, bottom shadow, press-down), one radius, Pixelify Sans for headings and numbers.
   Layout is plain CSS so the page holds together even if the Tailwind CDN is slow; Tailwind supplies small utilities inside panels. */
:root{color-scheme:light;--bg:#e4f1ea;--panel:#ffffff;--panel2:#f0f8f3;--ink:#12313a;--muted:#5b7780;--line:#c9ddd2;--edge:#a9c4b6;--accent:#1f8fd1;--leaf:#3a9a49;--leaf-d:#2a7a37;--leaf-soft:#e2f4e3;--gold:#d99a12;--gold-d:#a8760c;--gold-soft:#fff2cf;--gem:#6b4ce6;--bad:#cf4336;--bad-d:#9c2f25;--good:#2f9e55;--r:12px;--shadow:0 1px 0 rgba(18,49,58,.06),0 6px 18px rgba(18,49,58,.07)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 'Nunito',system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1320px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.px{font-family:'Pixelify Sans',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.gem{color:var(--gem)} code{font-family:ui-monospace,monospace;background:var(--panel2);padding:0 4px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input[type=range],input[type=checkbox]{accent-color:var(--leaf)}
button{cursor:pointer;font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:var(--r);background:var(--leaf);color:#fff;border:2px solid var(--leaf-d);box-shadow:0 3px 0 var(--leaf-d)}
.hudchip{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:5px 12px;box-shadow:var(--shadow);min-width:0}
.hudchip small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;line-height:1}
.hudchip.bump{animation:bump .28s ease-out}
.mini{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:3px;min-width:92px} .mini i{display:block;height:100%;width:0;background:var(--gem)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--r);border:2px solid var(--edge);background:var(--panel);color:var(--ink);font-weight:800;box-shadow:0 3px 0 var(--edge);transition:transform .06s,box-shadow .06s,filter .12s;user-select:none}
.btn:hover{filter:brightness(1.05)} .btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.btn.go{background:var(--leaf);border-color:var(--leaf-d);color:#fff;box-shadow:0 3px 0 var(--leaf-d)} .btn.go:active{box-shadow:0 0 0 var(--leaf-d)}
.btn.gold{background:var(--gold);border-color:var(--gold-d);color:#241a00;box-shadow:0 3px 0 var(--gold-d)} .btn.gold:active{box-shadow:0 0 0 var(--gold-d)}
.btn.bad{background:var(--bad);border-color:var(--bad-d);color:#fff;box-shadow:0 3px 0 var(--bad-d)} .btn.bad:active{box-shadow:0 0 0 var(--bad-d)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:10px;box-shadow:0 2px 0 var(--edge)} .btn.sm:active{transform:translateY(2px);box-shadow:0 0 0 var(--edge)}
.btn.icon{padding:0;width:40px;height:40px}
.btn.poor{background:var(--panel2);color:var(--muted);box-shadow:0 2px 0 var(--line);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.grow{flex:1 1 auto}

/* layout */
.main{display:grid;gap:12px;align-items:start}
@media (min-width:1024px){.main{grid-template-columns:minmax(0,1.45fr) minmax(340px,1fr)}}
.stage{position:relative;height:clamp(380px,62vh,700px);border-radius:18px;overflow:hidden;border:2px solid var(--line);box-shadow:var(--shadow);background:#cfeef7}
#stageBox{position:absolute;inset:0}
#cv{display:block;touch-action:none;cursor:crosshair}
.sunbox{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:200px;pointer-events:none;background:rgba(255,255,255,.55);border:2px solid rgba(16,52,60,.2);border-radius:14px;padding:2px 8px 4px;text-align:center}
.sunbox svg{display:block;width:100%;height:44px}
.sunbox .num{font-family:'Pixelify Sans',monospace;font-size:14px;color:#10343c;line-height:1}
.combo{position:absolute;right:14px;top:76px;transform-origin:right center;font-family:'Pixelify Sans',monospace;font-size:34px;line-height:1;color:#fff4c2;-webkit-text-stroke:2px #8a3d0e;paint-order:stroke fill;text-shadow:0 3px 0 #b8531a;opacity:0;pointer-events:none}
.combo.pop{animation:cpop .18s ease-out}
.banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:'Pixelify Sans',monospace;font-size:46px;color:#fff;-webkit-text-stroke:2px rgba(16,52,60,.55);paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.25);opacity:0;pointer-events:none}
.banner.go{animation:banner 1.5s ease-out forwards}
.hint{position:absolute;left:12px;right:90px;bottom:10px;font-size:12.5px;font-weight:700;color:#10343c;background:rgba(255,255,255,.72);border-radius:10px;padding:5px 10px;pointer-events:none}
.rate{position:absolute;right:12px;bottom:10px;font-size:14px;color:#10343c;background:rgba(255,255,255,.72);border-radius:10px;padding:3px 9px;pointer-events:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(207,238,247,.45);cursor:pointer}
.playbtn{font-family:'Pixelify Sans',monospace;font-size:22px;padding:14px 26px;border-radius:14px}
.stagebar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:10px}
.opt{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
.goal-d{margin-top:12px}

/* next-goal strip */
.goal{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 12px;border-radius:var(--r);border:2px solid var(--edge);background:var(--panel);box-shadow:0 3px 0 var(--edge);color:var(--ink);font-weight:800;transition:transform .06s,box-shadow .06s}
.goal:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.goal .gic{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:9px;background:var(--gold-soft);color:var(--gold-d)}
.goal .gl{min-width:0;flex:1}
.goal .gt{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.goal .gn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .gbar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px}
.goal .gbar i{display:block;height:100%;width:0;background:var(--accent)}
.goal.aff{border-color:var(--leaf-d);box-shadow:0 3px 0 var(--leaf-d)} .goal.aff .gbar i{background:var(--leaf)} .goal.aff .gic{background:var(--leaf-soft);color:var(--leaf-d)}
.goal.pulse{animation:pulse1 1.1s ease-out 1}
.goal-m{display:none}

/* panel + mobile bottom sheet */
.panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:12px;min-width:0}
#sheetHead{display:none}
#panelBody{max-height:min(68vh,720px);overflow-y:auto;padding:2px 4px 2px 0}
@media (max-width:1023.98px){
  .wrap{padding-bottom:140px}
  .goal-d{display:none} .goal-m{display:flex}
  #panel{position:fixed;left:0;right:0;bottom:0;z-index:15;border-radius:18px 18px 0 0;border-bottom:0;padding:0 12px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(0,0,0,.18)}
  #sheetHead{display:block}
  #sheetHandle{display:block;width:100%;height:22px;background:none;border:0;padding:0}
  #sheetHandle .grip{display:block;width:44px;height:5px;border-radius:99px;background:var(--edge);margin:8px auto 0}
  #sheetBody{display:none;margin-top:10px}
  #panel.open #sheetBody{display:block}
  #panel.open #panelBody{max-height:min(56vh,520px)}
}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 8px;border-radius:var(--r);border:2px solid var(--edge);background:var(--panel);box-shadow:0 2px 0 var(--edge);font-weight:800;font-size:12.5px;color:var(--muted)}
.tab:active{transform:translateY(2px);box-shadow:0 0 0 var(--edge)}
.tab.on{background:var(--leaf);border-color:var(--leaf-d);color:#fff;box-shadow:0 2px 0 var(--leaf-d)}
.tab.icon{flex:0 0 46px}
.tab .dot{position:absolute;top:-6px;right:-5px;width:13px;height:13px;border-radius:50%;background:var(--bad);border:2px solid var(--panel)}

/* upgrade cards */
.ucard{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:2px solid var(--line);border-radius:var(--r);background:var(--panel2);min-width:0}
.ucard.buy{border-color:var(--leaf);background:var(--leaf-soft)}
.ucard.lock{opacity:.62;border-style:dashed}
.ucard.own{opacity:.7}
.ucard .tile{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#fff;border:2px solid rgba(0,0,0,.22);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.ucard .nm{font-family:'Pixelify Sans',monospace;font-size:14px;line-height:1.15}
.ucard .ef{font-size:12px;color:var(--muted);line-height:1.25;margin-top:2px}
.ucard .pr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:74px}
.ucard .pbar{width:74px;height:4px;border-radius:99px;background:var(--line);overflow:hidden} .ucard .pbar i{display:block;height:100%;background:var(--accent)}
.ucard .need{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--muted);text-align:right;max-width:110px}
.ucard.hl{animation:hl 1.7s ease-out}
.ucard.onroute{outline:3px solid var(--accent);outline-offset:1px}
.rt{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:8px;border:2px solid var(--line);background:var(--panel);color:var(--muted)} .rt:hover{color:var(--accent);border-color:var(--accent)}
.node{text-align:left;padding:9px 11px;border-radius:var(--r);border:2px solid var(--line);background:var(--panel);min-width:0}
.node.buy{border-color:var(--leaf);background:var(--leaf-soft)} .node.poor{opacity:.85} .node.own{background:var(--panel2);color:var(--leaf);border-color:var(--line)}
details.sec{border:2px solid var(--line);border-radius:var(--r);background:var(--panel2);margin-bottom:10px}
details.sec>summary{cursor:pointer;list-style:none;padding:8px 12px;font-family:'Pixelify Sans',monospace;font-size:14px;display:flex;align-items:center;justify-content:space-between;border-radius:var(--r)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:'▾';opacity:.6} details.sec[open]>summary::after{content:'▴'}
details.sec>.secb{padding:2px 12px 12px}

/* shared bits */
.card2{background:var(--panel2);border:2px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.chip{display:inline-flex;gap:5px;align-items:center;padding:3px 10px;border-radius:99px;border:2px solid var(--line);background:var(--panel);font-size:12px;font-weight:800;color:var(--muted)}
.chip.on{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf-d)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:4px 10px;font-size:12px;font-weight:800;color:var(--muted);background:var(--panel);border:0}
.seg button.on{background:var(--leaf);color:#fff}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden} .bar i{display:block;height:100%;background:var(--gem)}
.note{display:flex;gap:6px;align-items:center;font-size:12px;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:5px 10px}
.gold-note{background:var(--gold-soft);border-color:var(--gold)}
.ach{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:10px;border:2px solid var(--line);opacity:.6;min-width:0}
.ach.got{opacity:1;background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf-d)}
.field{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--ink)}
.out{margin-top:8px;background:var(--panel2);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:8px;font-size:12px;white-space:pre-wrap;min-height:34px;overflow-x:auto}
.swatch{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.25)}
.node,.rt{cursor:pointer}

/* toasts, modal, coach */
#toasts{position:fixed;z-index:30;bottom:16px;right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:8px;align-content:end;width:min(300px,calc(100vw - 32px));pointer-events:none}
#toasts .toast{pointer-events:auto}
@media (max-width:1023.98px){
  #toasts{top:auto;right:12px;left:12px;width:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  body:has(#panel.open) #toasts{top:calc(env(safe-area-inset-top,0px) + 8px);bottom:auto;left:auto;width:min(300px,calc(100vw - 32px))}
}

.toast{display:flex;gap:10px;align-items:center;background:var(--leaf-soft);color:var(--leaf-d);border:2px solid var(--leaf);border-radius:var(--r);padding:9px 12px;box-shadow:var(--shadow);animation:pop .25s ease-out}#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(8,24,30,.55);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.mcard{width:min(420px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.mcard td{padding:4px 0;border-bottom:1px dashed var(--line)} .mcard .r{text-align:right;padding-left:10px;color:var(--muted)} .mcard td.px{color:var(--ink)}
.rowrv{opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s} .rowrv.in{opacity:1;transform:none}
.tot{opacity:0;transform:scale(.6)} .tot.in{opacity:1;transform:none;animation:totpop .45s cubic-bezier(.2,1.6,.4,1)}
.stamp{display:inline-block;margin-left:8px;padding:0 8px;border:3px solid var(--bad);border-radius:8px;color:var(--bad);font-family:'Pixelify Sans',monospace;font-size:15px;vertical-align:middle;transform:rotate(-8deg);animation:stampin .35s cubic-bezier(.2,1.8,.4,1)}
#coach{position:fixed;z-index:18;left:0;top:0;max-width:min(250px,calc(100vw - 24px));background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:var(--r);padding:9px 32px 9px 12px;font-weight:800;font-size:13px;line-height:1.3;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
#coach.on{opacity:1;pointer-events:auto}
#coach::after{content:'';position:absolute;left:var(--ax,50%);width:12px;height:12px;background:var(--panel);transform:translateX(-50%) rotate(45deg)}
#coach[data-side="top"]::after{bottom:-9px;border-right:2px solid var(--line);border-bottom:2px solid var(--line)} #coach[data-side="bottom"]::after{top:-9px;border-left:2px solid var(--line);border-top:2px solid var(--line)}
#coach button{position:absolute;top:5px;right:5px;width:22px;height:22px;display:grid;place-items:center;border:0;border-radius:6px;background:rgba(18,49,58,.1);color:inherit;padding:0}
#coach button:focus-visible{outline-color:var(--gold)}
#coinCv{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:25}

@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@keyframes bump{50%{transform:scale(1.12)}}
@keyframes cpop{from{transform:scale(1.35)}to{transform:scale(1)}}
@keyframes banner{0%{opacity:0;transform:translateY(14px) scale(.8)}20%{opacity:1;transform:scale(1.08)}65%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-12px)}}
@keyframes pulse1{0%{box-shadow:0 0 0 0 rgba(58,154,73,.75),0 3px 0 var(--leaf-d)}100%{box-shadow:0 0 0 16px rgba(58,154,73,0),0 3px 0 var(--leaf-d)}}
@keyframes hl{0%,60%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes totpop{0%{transform:scale(.5)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes stampin{from{transform:rotate(-8deg) scale(2.2);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="hud">
    <div class="brand">
      <span class="logo"><i data-lucide="droplets" class="w-5 h-5"></i></span>
      <div class="px text-xl leading-none">HarBEST!</div>
    </div>
    <div class="hudchip" id="chipMoney"><i data-lucide="coins" class="w-4 h-4" style="color:var(--gold)"></i><div><small>Money</small><b class="px text-base" id="hMoney">$0</b></div></div>
    <div class="hudchip"><i data-lucide="sun" class="w-4 h-4" style="color:var(--accent)"></i><div><small>Day</small><b class="px text-base" id="hDay">Day 1</b></div></div>
    <div class="hudchip" id="chipDia" hidden title="Diamonds this run. Earn more to reach the next goal."><i data-lucide="gem" class="w-4 h-4 gem"></i><div><small>Diamonds</small><b class="px text-base"><span id="hDia">◆ 0/2</span> <span class="opacity-60 text-xs" id="hDiaNext">$5K</span></b><div class="mini"><i id="hDiaBar"></i></div></div></div>
    <button class="btn icon" id="btnMute" aria-label="Mute sound" aria-pressed="false"></button>
    <button class="btn icon" id="btnMenu" aria-label="Menu" title="Menu"><i data-lucide="settings" class="w-5 h-5"></i></button>
  </header>

  <main class="main">
    <section class="min-w-0">
      <div class="stage" id="stage">
        <div id="stageBox"><canvas id="cv"></canvas></div>
        <div class="sunbox" role="timer" aria-label="Time left in the day">
          <svg viewBox="0 0 200 44" aria-hidden="true"><path d="M10 40 Q100 -34 190 40" fill="none" stroke="rgba(16,52,60,.35)" stroke-width="2" stroke-dasharray="3 4"/><line x1="4" y1="41" x2="196" y2="41" stroke="rgba(16,52,60,.3)" stroke-width="2"/><circle id="sunDot" cx="10" cy="40" r="7" fill="#ffc83a" stroke="#c98a00" stroke-width="2"/></svg>
          <div class="num" id="hTime">30s</div>
        </div>
        <div class="combo" id="combo" aria-hidden="true"></div>
        <div class="banner" id="dayBanner" aria-hidden="true"></div>
        <div class="hint" id="hint">Move the ring over crops to water them. Touch ripe crops to pick them.</div>
        <div class="rate px" id="hRate">$0/s</div>
        <div class="overlay" id="overlay"><button class="btn go playbtn" tabindex="-1"><i data-lucide="play" class="w-6 h-6"></i><span id="ovLabel">Play day 1</span></button></div>
      </div>
      <div class="stagebar">
        <button id="btnPlay" class="btn go"><i data-lucide="play" class="w-4 h-4"></i> Play day</button>
        <span id="stageOpts" class="contents" hidden>
          <button id="btnSpeed" class="btn" title="Game speed"><i data-lucide="zap" class="w-4 h-4"></i> Speed <span id="hSpeed">1×</span></button>
          <label class="opt"><input type="checkbox" id="chkAuto"> Start next day automatically</label>
          <label class="opt" title="After each day, a min-heap buys the cheapest open upgrade until money runs out"><input type="checkbox" id="chkGreedy"> Auto-buy cheapest upgrades</label>
        </span>
      </div>
      <div class="goal-d" id="goalD"></div>
    </section>

    <aside class="panel" id="panel">
      <div id="sheetHead">
        <button id="sheetHandle" aria-expanded="false" aria-controls="sheetBody" aria-label="Expand panel"><span class="grip"></span></button>
        <div class="goal-m" id="goalM"></div>
      </div>
      <div id="sheetBody">
        <nav class="tabs" id="tabsNav" aria-label="Game panels" hidden></nav>
        <div id="panelBody"></div>
      </div>
    </aside>

_o = 'O(n*W) time, O(n*W) space'\n\n    def prepare(self, d):\n        return d['items'], int(d['cap'])\n\n    def solve(self, d):\n        items, W = self.prepare(d)\n        n = len(items)\n        dp = [[0] * (W + 1) for _ in range(n + 1)]\n        for i in range(1, n + 1):\n            w, v = items[i - 1]['w'], items[i - 1]['v']\n            for c in range(W + 1):\n                self.ops += 1\n                best = dp[i - 1][c]\n                if c >= w and dp[i - 1][c - w] + v > best:\n                    best = dp[i - 1][c - w] + v\n                dp[i][c] = best\n        ids, c = [], W\n        for i in range(n, 0, -1):\n            if dp[i][c] != dp[i - 1][c]:\n                ids.append(items[i - 1]['id'])\n                c -= items[i - 1]['w']\n        return {'ids': ids[::-1], 'score': dp[n][W]}\n\n\nclass UpgradeKnapsack(Knapsack):\n    \"\"\"Same DP; prices are scaled down to at most 400 units first.\"\"\"\n    def prepare(self, d):\n        money = d['money']\n        unit = max(1, math.ceil(money / 400))\n        items = [{'id': i['id'], 'w': math.ceil(i['cost'] / unit), 'v': i['v']} for i in d['items']]\n        return items, int(math.floor(money / unit))\n\n\nclass RoutePlanner(Planner):\n    \"\"\"Dijkstra with a binary heap. adj[u] = [[v, weight], ...].\"\"\"\n    big_o = 'O((V+E) log V)'\n\n    def solve(self, d):\n        adj, src, t = d['adj'], d['src'], d['target']\n        dist = [float('inf')] * len(adj)\n        prev = [-1] * len(adj)\n        dist[src] = 0\n        pq = [(0, src)]\n        while pq:\n            du, u = heapq.heappop(pq)\n            self.ops += 1\n            if du > dist[u]:\n                continue\n            if u == t:\n                break\n            for v, w in adj[u]:\n                nd = du + w\n                if nd < dist[v]:\n                    dist[v] = nd\n                    prev[v] = u\n                    heapq.heappush(pq, (nd, v))\n        path, v = [], t\n        while v != -1:\n            path.append(v)\n            v = prev[v]\n        return {'path': path[::-1], 'dist': dist[t]}\n\n\nclass TreeAnalyzer(Planner):\n    \"\"\"Iterative depth-first pre-order using an explicit Stack.\"\"\"\n    big_o = 'O(V)'\n\n    def solve(self, d):\n        kids, st, order, depth = d['kids'], Stack(), [], 0\n        for r in reversed(d['roots']):\n            st.push((r, 0))\n        while len(st):\n            nid, dp = st.pop()\n            self.ops += 1\n            order.append(nid)\n            depth = max(depth, dp)\n            for c in reversed(kids.get(nid, [])):\n                st.push((c, dp + 1))\n        return {'order': order, 'depth': depth}\n\n\nPLANNERS = {'heirloom': Knapsack, 'upgrade': UpgradeKnapsack, 'route': RoutePlanner, 'tree': TreeAnalyzer}\n\n\ndef run_planner(kind, raw):\n    return json.dumps(PLANNERS[kind]().report(json.loads(raw)))\n";

/* ===== v3 audio: Web Audio API only, no files =====
   One AudioContext (made on the first user gesture). Gameplay SFX and music run on separate buses into a master
   gain, then a DynamicsCompressor. One-shot voices are capped at ~8 and every sound type is rate limited. */
const AUD = (() => {
  let ctx = null, master, comp, sfxBus, musBus, arpBus, white, brown, voices = 0, duck = 1, rateSm = 0, lastTick = -1, lastQ = -1, mTimer = 0, nextT = 0, step = 0;
  const last = {}, loops = {}, set = () => G.meta.set;
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  const PENT = [0, 2, 4, 7, 9], ladder = n => 60 + 12 * Math.floor(n / 5) + PENT[n % 5];   // C major pentatonic ladder
  const lim = (k, ms) => { const n = performance.now(); if (n - (last[k] || 0) < ms) return false; last[k] = n; return true; };

  function mkBuf(kind) {
    const len = ctx.sampleRate * 2, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0); let l = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; if (kind === 'brown') { l = (l + .02 * w) / 1.02; d[i] = l * 3.5; } else d[i] = w; }
    return b;
  }
  function init() {
    if (ctx) { if (ctx.state === 'suspended' && !document.hidden) ctx.resume(); return ctx; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; return null; }
    comp = ctx.createDynamicsCompressor(); comp.threshold.value = -20; comp.knee.value = 24; comp.ratio.value = 4; comp.attack.value = .004; comp.release.value = .22;
    master = ctx.createGain(); sfxBus = ctx.createGain(); musBus = ctx.createGain(); arpBus = ctx.createGain();
    sfxBus.connect(master); musBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
    arpBus.connect(musBus);                                  // arpeggio bus gets a soft feedback echo
    const dly = ctx.createDelay(1), fb = ctx.createGain(), wet = ctx.createGain(), lp = ctx.createBiquadFilter();
    dly.delayTime.value = .28; fb.gain.value = .3; wet.gain.value = .32; lp.type = 'lowpass'; lp.frequency.value = 2200;
    arpBus.connect(dly); dly.connect(lp); lp.connect(fb); fb.connect(dly); lp.connect(wet); wet.connect(musBus);
    white = mkBuf('white'); brown = mkBuf('brown');
    vols(true); nextT = ctx.currentTime + .2; step = 0; sched();
    return ctx;
  }
  function vols(now) {
    if (!ctx) return; const t = ctx.currentTime, s = set(), k = now ? 0.001 : .06;
    master.gain.setTargetAtTime(s.mute ? 0 : 1, t, k);
    sfxBus.gain.setTargetAtTime(s.sfx * 1.5, t, k);
    musBus.gain.setTargetAtTime(s.music * 1.3 * duck, t, now ? .001 : .25);
  }
  /* one oscillator voice: o = { f, f2, type, t, dur, vol, att, sus, lp, det, bus, pri, m } */
  function tone(o) {
    if (!ctx || (!o.m && voices >= (o.pri ? 16 : 8))) return;
    const t = o.t != null ? o.t : ctx.currentTime, dur = o.dur || .15, osc = ctx.createOscillator(), g = ctx.createGain(), v = o.vol || .1, a = o.att || .006;
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(o.f, t); if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + dur); if (o.det) osc.detune.value = o.det;
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + a); if (o.sus) g.gain.setValueAtTime(v, t + dur * o.sus); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    let out = g; osc.connect(g);
    if (o.lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; g.connect(f); out = f; }
    out.connect(o.bus || sfxBus); osc.start(t); osc.stop(t + dur + .03);
    if (!o.m) voices++;
    osc.onended = () => { if (!o.m) voices--; g.disconnect(); if (out !== g) out.disconnect(); };
  }
  /* one filtered-noise voice: o = { type, f0, f1, q, t, dur, vol, att, brown, bus, pri } */
  function noise(o) {
    if (!ctx || voices >= (o.pri ? 16 : 8)) return;
    const t = o.t != null ? o.t : ctx.currentTime, dur = o.dur || .1, src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(), v = o.vol || .1, a = o.att || .008;
    src.buffer = o.brown ? brown : white; src.loop = true; f.type = o.type || 'bandpass'; f.Q.value = o.q || .8;
    f.frequency.setValueAtTime(o.f0 || 1000, t); if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(o.bus || sfxBus); src.start(t, Math.random() * 1.5); src.stop(t + dur + .03);
    voices++; src.onended = () => { voices--; g.disconnect(); f.disconnect(); };
  }
  const arp = (notes, o) => notes.forEach((m, i) => tone(Object.assign({ f: midi(m), t: ctx.currentTime + i * (o.gap || .07) }, o)));

  /* ---- gameplay sounds ---- */
  const BUYS = { H: [64, [0, 4, 7, 12], 'triangle', .06], G: [67, [0, 2, 4, 7], 'sine', .07], Y: [72, [0, 7, 12, 16], 'square', .05, 3000], F: [57, [0, 7, 12, 19], 'sawtooth', .06, 1800],
    R: [69, [12, 9, 4, 0], 'triangle', .07], I: [62, [0, 5, 7, 12], 'sine', .07], M: [48, [0, 7, 12], 'square', .08, 1400], T: [50, [0, 7, 0, 12], 'sawtooth', .07, 1200],
    D: [76, [0, 4, 7, 9, 12], 'triangle', .045], J: [71, [0, 2, 7, 9], 'sine', .06], P: [65, [0, 4, 9, 12], 'triangle', .06], L: [60, [0, 4, 7, 12, 16], 'sine', .09] };
  const EV = {
    water(prog) { if (!lim('water', 85)) return; const p = prog == null ? .5 : prog; noise({ type: 'bandpass', f0: 500 + 1700 * p, f1: 900 + 2300 * p, q: .9, dur: .11, vol: .07 }); },
    ripe() { if (!lim('ripe', 140)) return; const f = [1175, 1319, 1568][(Math.random() * 3) | 0]; tone({ f, dur: .32, vol: .045, att: .004 }); tone({ f: f * 2, dur: .2, vol: .015 }); },
    harvest(a) { const c = a && a.n || 1, by = a && a.by, own = by === 'ring'; if (!lim('harv', own ? 45 : 95)) return;
      const f = midi(ladder(Math.min(14, c - 1))), v = own ? .1 : .05;
      tone({ f, type: 'triangle', dur: .17, vol: v, att: .003 }); tone({ f: f * 2, dur: .1, vol: v * .35, att: .003 }); },
    buy(n) { if (!lim('buy', 120)) return; const b = BUYS[n && n.c || 'L'] || BUYS.L; arp(b[1].map(s => b[0] + s), { type: b[2], gap: b[3], dur: .2, vol: .08, lp: b[4], pri: 1 }); },
    deny() { if (!lim('deny', 220)) return; tone({ f: 130, f2: 92, type: 'sawtooth', dur: .2, vol: .07, lp: 520 }); },
    hover() { if (!lim('hover', 70)) return; tone({ f: 1700, dur: .03, vol: .012, att: .002 }); },
    click() { if (!lim('click', 50)) return; tone({ f: 660, f2: 520, type: 'triangle', dur: .05, vol: .03, att: .002 }); },
    irr() { if (!lim('irr', 300)) return; noise({ type: 'bandpass', f0: 300, f1: 1800, q: 1.4, dur: .4, vol: .07, att: .12 }); tone({ f: 180, f2: 120, dur: .12, vol: .05 }); },
    mole() { if (!lim('mole', 300)) return; tone({ f: 110, f2: 55, dur: .2, vol: .12 }); noise({ type: 'lowpass', f0: 500, f1: 200, dur: .16, vol: .06 }); },
    jet() { if (!lim('jet', 600)) return; noise({ type: 'highpass', f0: 1500, f1: 3500, q: .7, dur: .28, vol: .04, att: .05 }); },
    tally(i) { if (!lim('tally', 60)) return; tone({ f: midi(ladder(Math.min(14, i))), type: 'triangle', dur: .12, vol: .05, pri: 1 }); },
    total() { arp([72, 79, 84], { type: 'triangle', gap: .06, dur: .3, vol: .07, pri: 1 }); },
    best() { arp([84, 88, 91, 96], { type: 'sine', gap: .05, dur: .35, vol: .06, pri: 1 }); noise({ type: 'highpass', f0: 5000, dur: .3, vol: .02, pri: 1 }); },
    ach() { arp([79, 86], { type: 'sine', gap: .09, dur: .3, vol: .07, pri: 1 }); },
    dayStart() { lastTick = -1; arp([72, 76, 79], { type: 'triangle', gap: .09, dur: .4, vol: .06, pri: 1 }); tone({ f: midi(84), dur: .6, vol: .02, t: ctx.currentTime + .27, pri: 1 }); },
    tick(s) { tone({ f: s <= 1 ? 1500 : 1100, type: 'square', dur: .04, vol: .035, lp: 3000, pri: 1 }); },
    dayEnd() { arp([67, 72, 76, 79], { type: 'triangle', gap: .1, dur: .5, vol: .07, pri: 1 }); [60, 64, 67].forEach(m => tone({ f: midi(m), t: ctx.currentTime + .42, dur: 1.1, vol: .035, att: .05, sus: .5, pri: 1 })); },
    dia() { arp([72, 76, 79, 84, 88], { type: 'triangle', gap: .09, dur: .5, vol: .07, pri: 1 }); noise({ type: 'highpass', f0: 5000, f1: 8000, dur: .6, vol: .02, att: .1, pri: 1 }); },
    prestige() { tone({ f: midi(36), dur: 1.6, vol: .1, att: .02, pri: 1 }); arp([60, 64, 67, 72, 76, 79, 84], { type: 'triangle', gap: .1, dur: .6, vol: .07, pri: 1 }); [72, 76, 79, 84].forEach(m => tone({ f: midi(m), t: ctx.currentTime + .75, dur: 1.4, vol: .04, att: .04, sus: .5, pri: 1 })); },
    warn() { noise({ brown: true, type: 'lowpass', f0: 90, f1: 150, q: .7, dur: 1.3, vol: .3, att: 1.2, pri: 1 }); },
    zap() { noise({ type: 'highpass', f0: 2500, f1: 800, q: .7, dur: .25, vol: .2, pri: 1 }); noise({ brown: true, type: 'lowpass', f0: 220, f1: 60, q: .7, dur: 1.2, vol: .38, att: .01, pri: 1 }); tone({ f: 70, f2: 38, dur: 1, vol: .22, pri: 1 }); },
  };

  /* ---- machine loops: always-running sources whose gain fades with the machine state ---- */
  function mkLoop(kind) {
    const g = ctx.createGain(); g.gain.value = 0; g.connect(sfxBus);
    const noiseSrc = buf => { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; return s; };
    if (kind === 'rain') { const s = noiseSrc(white), f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = .5; s.connect(f); f.connect(g); s.start(); }
    else if (kind === 'tractor') {
      const o = ctx.createOscillator(), lfo = ctx.createOscillator(), lg = ctx.createGain(), f = ctx.createBiquadFilter(), s = noiseSrc(brown);
      o.type = 'sawtooth'; o.frequency.value = 44; lfo.frequency.value = 9; lg.gain.value = 6; lfo.connect(lg); lg.connect(o.frequency);
      f.type = 'lowpass'; f.frequency.value = 170; o.connect(f); s.connect(f); f.connect(g); o.start(); lfo.start(); s.start();

      o.type = 'sawtooth'; o.frequency.value = 190; trem.gain.value = .6; lfo.frequency.value = 34; lg.gain.value = .4; lfo.connect(lg); lg.connect(trem.gain);

      tone({ f: midi(ch.bass), type: 'triangle', t, dur: 1.4, vol: .17 * bassL, lp: 420, bus: musBus, m: 1 });
    } else if (pos === 4 || (pos === 6 && bassL > .6)) tone({ f: midi(ch.bass + (pos === 6 ? 7 : 0)), type: 'triangle', t, dur: .8, vol: .12 * bassL, lp: 420, bus: musBus, m: 1 });

    if (hiL > .05 && (pos & 1) && Math.random() < .6) tone({ f: midi(ch.arp[(pos + 2) % 5] + 24), type: 'sine', t, dur: .3, vol: .03 * hiL, att: .003, bus: arpBus, m: 1 });

    if (!ctx) return;

  }

  return {
    unlock: init, vols, get ready() { return !!ctx; },
    sfx, duck(on) { duck = on ? .3 : 1; vols(); },
    vis(v) { if (!ctx) return; if (v) ctx.resume(); else ctx.suspend(); },
    frame(dt) {

    },

})();

/* ---------- particles: a fixed pool (Stack of free objects) plus a Deque of live ones, so nothing is allocated per frame ---------- */
class Particles {

    const yy = y - 26 * SC; cx.fillStyle = '#3a4a57'; cx.fillRect(x - 6 * SC, yy - 2 * SC, 12 * SC, 5 * SC); cx.fillStyle = '#9fb6c4'; const w = Math.sin(t * 40) * 3 * SC; cx.fillRect(x - 12 * SC + w, yy - 4 * SC, 8 * SC, 2 * SC); cx.fillRect(x + 4 * SC - w, yy - 4 * SC, 8 * SC, 2 * SC); }
  if (M.u.rain && S.rain.on) { const [x, y] = w2s(S.rain.cx, S.rain.cy), yy = y - 42 * SC;
    cx.fillStyle = '#eef4f8'; for (const [dx, dy, r] of [[-14, 2, 11], [0, -5, 14], [14, 2, 11], [0, 4, 12]]) { cx.beginPath(); cx.arc(x + dx * SC, yy + dy * SC, r * SC, 0, 7); cx.fill(); }
    cx.strokeStyle = '#4aa8e8'; cx.lineWidth = lw * .7; cx.beginPath(); for (let k = 0; k < 9; k++) { const dx = (k - 4) * 6 * SC, ph = (t * 2.2 + k * .37) % 1; cx.moveTo(x + dx, yy + 12 * SC + ph * 40 * SC); cx.lineTo(x + dx - 2 * SC, yy + 18 * SC + ph * 40 * SC); } cx.stroke(); }
  drawFX();
  if (S.mouse) {
    const rr = M.ringR, rx = M.swing ? rr * 2.4 : rr;
    wellipse(S.rx, S.ry, rx, rr, 'rgba(90,190,255,.20)', '#ffffff', 2.2); wellipse(S.rx, S.ry, rx, rr, null, 'rgba(40,130,210,.9)', 1);
  }
  if (u > .8) { cx.fillStyle = `rgba(90,50,110,${(.14 * (u - .8) / .2).toFixed(3)})`; cx.fillRect(0, 0, W, H); }   // dusk tint
  if (G.run.farm === 'storm') {
    cx.fillStyle = 'rgba(40,55,90,.16)'; cx.fillRect(0, 0, W, H);
    if (S.storm.warn > 0) { wellipse(S.storm.x, S.storm.y, 1.3, 1.3, `rgba(255,70,60,${.15 + .25 * Math.abs(Math.sin(t * 14))})`, '#ff5a4a', 2); }
    if (S.storm.flash > 0) { cx.fillStyle = `rgba(255,255,230,${S.storm.flash * 2.2})`; cx.fillRect(0, 0, W, H); }
  }
  cx.font = `${Math.max(11, 15 * SC)}px 'Pixelify Sans', monospace`; cx.textAlign = 'center';
  for (let i = 0; i < S.fx.size; i++) { const f = S.fx.at(i), [x, y] = w2s(f.x, f.y); cx.globalAlpha = Math.max(0, f.life / f.max); cx.fillStyle = '#10343c'; cx.fillText(f.txt, x + 1, y - 22 * SC + 1); cx.fillStyle = '#ffe27a'; cx.fillText(f.txt, x, y - 22 * SC); }
  cx.globalAlpha = 1;
}

/* ---------- panels: Upgrades and Prestige ---------- */
const SORT_UI = { price: ['Price, low to high', n => n.cost, 0], pricedesc: ['Price, high to low', n => n.cost, 1], name: ['Name, A to Z', n => n.name, 0], power: ['Power score', n => power(n), 1] };
const PYC = new HashTable();                           // memo of Python cross-checks
function pyCheck(kind, key, payload, same) {
  if (!PY.ready) return null;
  const k = kind + '|' + key, h = PYC.get(k); if (h !== undefined) return h;
  let r = false; try { r = !!same(JSON.parse(PY.py.globals.get('run_planner')(kind, JSON.stringify(payload)))); } catch (e) { r = false; }
  PYC.set(k, r); return r;
}
const badge = v => v === null ? '' : `<span class="chip ${v ? 'on' : ''}" title="The same plan was recomputed by the Python OOP planner in Pyodide">${v ? 'Python agrees' : 'Python differs'}</span>`;
function poolShares() { const tot = S.seeds.root ? S.seeds.root.sum : 0; return CROPS.map(c => { const nd = S.seeds.find(c.water); return tot && nd ? nd.w / tot : 0; }); }
const NST = n => OWN.has(n.id) ? 'own' : !reqOk(n) ? 'lock' : G.run.money >= n.cost ? 'buy' : 'poor';

/* branch -> [label, Lucide icon, tile colour]; one card per branch shows its next upgrade */
const BR = { H: ['Hands', 'hand', '#e8963a'], G: ['Growth', 'sprout', '#3a9a49'], Y: ['Yield', 'coins', '#d99a12'], F: ['Force', 'zap', '#6b6be6'], R: ['Rain', 'cloud-rain', '#3a9fe0'], I: ['Irrigator', 'waves', '#1fa3a3'],
  M: ['Mole', 'shovel', '#8a5d3d'], T: ['Tractor', 'truck', '#c0392b'], D: ['Drone', 'plane', '#5b7a8c'], J: ['Water Jet', 'droplets', '#1ab3d6'], P: ['Pickers', 'shopping-basket', '#d4577f'], L: ['Legacy', 'crown', '#8a5cd0'] };
const CHAIN = {}; NODES.forEach(n => (CHAIN[n.c] = CHAIN[n.c] || []).push(n));       // each branch in buying order
const prereqName = n => !n.req.length ? '' : n.req[0] === '@m' ? 'Any machine' : NODE[n.req[0]].name;

function ucard(n, o = {}) {
  const st = NST(n), [bn, ic, col] = BR[n.c], R = G.run, rt = o.rt, on = rt && rt.ids.includes(n.id);
  const pc = st !== 'own' ? TREE.costTo(n.id, id => OWN.has(id)) : 0;
  const tip = `${bn} branch. Power score ${power(n)}${pc > n.cost ? '. Cheapest path to it: $' + fmt(pc) : ''}${n.c === 'L' ? '. Legacy upgrades are small bonuses' : ''}`;
  let right;
  if (st === 'buy') right = `<div class="pr"><button class="btn go sm" data-act="buy" data-id="${n.id}" aria-label="Buy ${esc(n.name)} for $${fmt(n.cost)}">Buy · $${fmt(n.cost)}</button></div>`;
  else if (st === 'poor') right = `<div class="pr"><button class="btn poor sm" data-act="buy" data-id="${n.id}" aria-label="${esc(n.name)} costs $${fmt(n.cost)}. Not enough money yet">$${fmt(n.cost)}</button><div class="pbar"><i style="width:${Math.min(100, R.money / n.cost * 100).toFixed(1)}%"></i></div></div>`;
  else if (st === 'lock') right = `<div class="pr"><div class="need"><i data-lucide="lock" class="w-3.5 h-3.5 shrink-0"></i><span>Needs ${esc(prereqName(n))}</span></div></div>`;
  else right = `<div class="pr"><span class="chip on"><i data-lucide="check" class="w-3.5 h-3.5"></i>Owned</span></div>`;
  const route = o.adv && st !== 'own' ? `<button class="rt" data-act="route" data-id="${n.id}" title="Plan the cheapest route here" aria-label="Plan route to ${esc(n.name)}"><i data-lucide="git-branch" class="w-3.5 h-3.5"></i></button>` : '';
  return `<div class="ucard ${st}${on ? ' onroute' : ''}${hl === n.id ? ' hl' : ''}" data-id="${n.id}" data-st="${st}" title="${esc(tip)}"${o.d ? ` style="margin-left:${Math.min(o.d, 8) * 8}px"` : ''}>
    <span class="tile" style="background:${col}"><i data-lucide="${ic}" class="w-5 h-5"></i></span>
    <div class="min-w-0"><div class="flex items-center gap-1.5"><span class="nm">${esc(n.name)}</span>${route}</div><div class="ef">${n.desc}</div></div>${right}</div>`;
}

function renderSkills() {
  const R = G.run, day = S.phase === 'day', all = !!ui().all, adv = advOpen(), groups = ['All', 'Hands', 'Growth', 'Yield', 'Force', 'Machines', 'Pickers', 'Legacy'];
  const inG = g => NODES.filter(n => g === 'All' || n.grp === g);
  const nt = nextTarget();
  let rt = plan ? routeTo(plan.id) : null; if (rt && !rt.ids.length) { plan = null; rt = null; }
  let bundle = '';
  if (!day && nt) { const b = bestUpgradeBundle(); if (b.nodes.length) { const py = pyCheck('upgrade', Math.floor(R.money) + '|' + R.nodes.length, b.req, o => o.score === b.score);
    bundle = `<div class="card2 mb-2"><div class="flex flex-wrap items-center justify-between gap-2"><div class="px text-[13px]" title="Chosen by dynamic programming (a 0/1 knapsack): the most total power (${b.score}) for the money you have.">Best buy right now ${badge(py)}</div><button data-act="bundle" class="btn sm gold">Buy bundle · $${fmt(b.cost)}</button></div><div class="text-[11.5px] opacity-80 mt-1">${b.nodes.map(n => esc(n.name)).join(', ')}</div></div>`; } }
  const route = rt ? `<div class="card2 mb-2"><div class="px text-[13px] mb-0.5" title="Found with Dijkstra's shortest path over the upgrade dependency graph (${rt.pops} of ${NODES.length + 1} graph nodes visited).">Route to ${esc(NODE[rt.id].name)} ${badge(pyCheck('route', rt.id + '|' + R.nodes.length, rt.req, o => Math.abs(o.dist - rt.cost) <= 1e-6 * Math.max(1, rt.cost)))}</div>
    <div class="text-[11.5px] opacity-80 mb-1.5">${rt.ids.length} purchase${rt.ids.length > 1 ? 's' : ''}, $${fmt(rt.cost)} in total: ${rt.ids.map(id => esc(NODE[id].name)).join(' → ')}</div>
    <div class="flex gap-2"><button data-act="buyroute" class="btn sm gold" ${day ? 'disabled' : ''}>Buy as far as I can afford</button><button data-act="clearplan" class="btn sm">Clear</button></div></div>` : '';
  let body, foot = '';
  if (!all) {                                                           // default: the next upgrade of each branch, cheapest first, about 8 cards
    const cand = Object.keys(BR).map(c => CHAIN[c].find(n => !OWN.has(n.id))).filter(n => n && reqOk(n)), sorted = sortBy(cand, n => n.cost), shown = sorted.slice(0, 8);
    body = shown.length ? `<div class="grid gap-2">${shown.map(n => ucard(n, { adv, rt })).join('')}</div>` : '<div class="note">Everything is bought. Nice work!</div>';
    if (sorted.length > shown.length) foot = `<div class="text-[11.5px] opacity-70 mt-2">Showing the ${shown.length} cheapest of ${sorted.length}. Use “Show all upgrades” to see the rest.</div>`;
  } else {
    let list = inG(filt);
    if (stat === 'avail') list = list.filter(n => ['buy', 'poor'].includes(NST(n))); else if (stat === 'owned') list = list.filter(n => NST(n) === 'own'); else if (stat === 'locked') list = list.filter(n => NST(n) === 'lock');
    const [, kf, desc] = SORT_UI[sortK]; list = sortBy(list, kf, !!desc);
    if (view === 'tree') { const keep = new HashSet(), rows = []; list.forEach(n => keep.add(n.id)); TREE.preorder((id, d) => { if (keep.has(id)) rows.push([NODE[id], d]); }); body = `<div class="grid gap-2">${rows.map(([n, d]) => ucard(n, { d, adv, rt })).join('')}</div>`; }
    else body = list.length ? `<div class="grid gap-2">${list.map(n => ucard(n, { adv, rt })).join('')}</div>` : '<div class="note">Nothing in this view.</div>';
  }
  const advBody = `<div class="flex flex-wrap items-center justify-between gap-2 mb-2"><button data-act="undo" class="btn sm" ${UNDO.size && !day ? '' : 'disabled'}><i data-lucide="undo-2" class="w-3.5 h-3.5"></i> Undo${UNDO.size ? ' (' + UNDO.size + ')' : ''}</button>
      <div class="seg">${['list:List', 'tree:Tree'].map(s => { const [k, l] = s.split(':'); return `<button data-act="view" data-v="${k}" class="${all && view === k ? 'on' : ''}">${l}</button>`; }).join('')}</div></div>
    ${bundle}${route}
    <div class="flex flex-wrap items-center justify-between gap-2 mb-2"><div class="seg">${['avail:Available', 'locked:Locked', 'owned:Owned', 'all:All'].map(s => { const [k, l] = s.split(':'); return `<button data-act="stat" data-v="${k}" class="${all && stat === k ? 'on' : ''}">${l}</button>`; }).join('')}</div>
      <label class="flex items-center gap-1.5 text-xs">Sort <select id="sortSel" data-ui="sortK" class="field text-xs" ${view === 'tree' && all ? 'disabled' : ''}>${Object.entries(SORT_UI).map(([k, v]) => `<option value="${k}" ${sortK === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></label></div>
    <div class="flex flex-wrap gap-1.5">${groups.map(g => { const a = inG(g), o = a.filter(n => NST(n) === 'own').length; return `<button data-act="filt" data-v="${g}" class="chip ${all && filt === g ? 'on' : ''}">${g} <span class="opacity-70">${o}/${a.length}</span></button>`; }).join('')}</div>
    <div class="text-[11.5px] opacity-70 mt-2">Filters, sorting and the tree view work on the full list, so picking one switches to “Show all upgrades”.</div>`;
  return `${day ? '<div class="note mb-2"><i data-lucide="pause" class="w-3.5 h-3.5"></i> Upgrades are bought between days.</div>' : ''}
    <div class="flex items-center justify-between gap-2 mb-2"><div class="px text-sm">${R.nodes.length}/100 upgrades</div><button data-act="showall" class="btn sm">${all ? 'Show suggested only' : 'Show all upgrades'}</button></div>
    ${body}${foot}
    <details class="sec mt-3" data-sec="adv" ${adv ? 'open' : ''}><summary>Advanced</summary><div class="secb">${advBody}</div></details>`;
}

function sec(id, title, body, def) { const o = secOpen[id] === undefined ? def : secOpen[id]; return `<details class="sec" data-sec="${id}" ${o ? 'open' : ''}><summary>${title}</summary><div class="secb">${body}</div></details>`; }
function renderPrestige() {
  const R = G.run, m = G.meta, cap = FARMS[R.farm].cap, nextT = THR[R.dia], gain = R.dia, post = afterPrestige();
  const pres = conf.pres ? `<div class="flex gap-2"><button data-act="prestige" class="btn gold grow">Confirm: reset run, bank ${gain} ◆</button><button data-act="cancel" class="btn">Cancel</button></div>`
    : `<button data-act="prestige" class="btn gold w-full" ${gain < 1 || S.phase === 'day' ? 'disabled' : ''}><i data-lucide="sparkles" class="w-4 h-4"></i> Prestige${gain ? ' (+' + gain + ' ◆)' : ''}</button>`;
  const card = `<div class="card2 mb-3"><div class="flex items-center justify-between"><div class="px text-sm">This run: ${R.dia}/${cap} ◆</div>${m.dia > 0 ? `<div class="px text-sm gem">${m.dia} ◆ banked</div>` : ''}</div>
    ${post ? `<div class="flex flex-wrap gap-1.5 my-2">${THR.slice(0, cap).map((t, i) => `<span class="chip ${R.dia > i ? 'on' : ''}">◆${i + 1} · $${fmt(t)}</span>`).join('')}</div>` : '<div class="h-2"></div>'}
    <div class="bar mb-2"><i style="width:${nextT && R.dia < cap ? Math.min(100, R.moneyRun / nextT * 100) : 100}%"></i></div>
    <div class="text-xs opacity-80 mb-2">${nextT && R.dia < cap ? `Earn $${fmt(nextT)} in this run for your next diamond. So far: $${fmt(R.moneyRun)}.` : 'This farm\'s diamond cap is reached. Extra days earn nothing, so prestige now.'}</div>
    ${pres}
    <div class="text-[11.5px] opacity-70 mt-2">${post ? `Prestige resets money and upgrades. Heirlooms, farms and achievements stay. Seasons so far: ${m.pres}.` : 'Prestige restarts your run. Money and upgrades reset, but the diamonds you earned are yours to keep.'}</div></div>`;
  if (!post) return card;                                                // before the first prestige: only the progress and the button
  const heirCard = h => { const own = m.heir.includes(h.id), can = m.dia >= h.cost;
    return `<button data-act="heir" data-id="${h.id}" class="node ${own ? 'own' : can ? 'buy' : 'poor'}"><span class="flex items-start justify-between gap-2"><span class="px text-[13px]">${h.name}</span><span class="px text-xs gem">${own ? 'Owned' : h.cost + ' ◆'}</span></span><span class="text-[11.5px] opacity-80 block mt-0.5">${h.d}</span></button>`; };
  const hb = bestHeirBundle(), hpy = hb.ids.length ? pyCheck('heirloom', m.dia + '|' + m.heir.length, hb.req, o => o.score === hb.score) : null;
  const hbCard = hb.ids.length ? `<div class="card2 mb-3"><div class="flex flex-wrap items-center justify-between gap-2"><div class="px text-[13px]" title="Dynamic programming over the heirloom list (priority ${hb.score}).">Best use of ${m.dia} ◆ ${badge(hpy)}</div><button data-act="heirbundle" class="btn sm gold">Buy bundle · ${hb.cost} ◆</button></div><div class="text-[11.5px] opacity-80 mt-1">${hb.ids.map(id => esc(HEIR[id].name)).join(', ')}</div></div>` : '';
  const heirBody = hbCard + ['Crops', 'Farms', 'Bonuses'].map(g => `<div class="px text-sm mb-1.5">${g}</div><div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3">${HEIRS.filter(h => h.g === g).map(heirCard).join('')}</div>`).join('');
  const farmNote = { small: 'Where everyone starts.', medium: 'More plots, one more diamond per run.', big: 'A wide field and a four-diamond cap.', storm: 'Rain waters crops for free, but lightning wipes a plot and its neighbours every few seconds.' };
  const farmBody = `<div class="grid gap-2">${Object.entries(FARMS).map(([id, f]) => { const own = farmOwned(id), cur = R.farm === id, nx = m.pend === id;
    return `<div class="card2 flex items-center justify-between gap-3"><div class="min-w-0"><div class="px text-[13px]">${f.name} <span class="opacity-60">${f.n}×${f.n}</span></div><div class="text-[11.5px] opacity-80">${farmNote[id]} Cap ${f.cap} ◆.</div></div>
      ${!own ? `<span class="chip">${HEIR[f.unlock].cost} ◆ in Heirlooms</span>` : cur && nx ? '<span class="chip on">Active</span>' : nx ? '<span class="chip on">Next run</span>' : `<button data-act="farm" data-id="${id}" class="btn sm">${cur ? 'Keep for next run' : 'Use next run'}</button>`}</div>`; }).join('')}</div>`;
  const sh = poolShares();
  const seedBody = `<div class="card2">${CROPS.map((c, i) => { const un = !c.unlock || m.heir.includes(c.unlock), sk = m.skip.includes(c.id);
      return `<div class="flex flex-wrap items-center gap-2 py-1 ${un ? '' : 'opacity-50'}"><span class="swatch" style="background:${c.col}"></span><span class="grow text-[13px]">${c.name}</span><span class="text-[11.5px] opacity-70 w-14 text-right">${c.water} water</span><span class="px text-xs w-12 text-right">$${c.value}</span><span class="text-[11.5px] w-10 text-right">${un ? (sk ? 'off' : Math.round(sh[i] * 100) + '%') : 'locked'}</span>${un ? `<button data-act="skip" data-id="${c.id}" class="btn sm">${sk ? 'Use' : 'Skip'}</button>` : '<span class="w-12"></span>'}</div>`; }).join('')}
      <div class="text-[11.5px] opacity-70 mt-1.5">Water needed, base sell price, share of new seeds. Skipping a seed removes it from the pool (a BST delete); unlocking adds it back. Radish is a stand-in starter crop; the original's is unknown.</div></div>`;
  const patches = components(S.fg.adj, v => S.plots[v].crop), big = patches.length ? Math.max(...patches) : 0;
  const moreBody = `<div class="card2 mb-3"><div class="text-[13px]"><b class="px">${patches.length}</b> crop patches now, largest <b class="px">${big}</b> plots.</div><div class="text-[11.5px] opacity-70 mt-1">Ripe crops of one type that touch pay +4% per connected neighbour, up to +40%. Fewer seed types make bigger patches.</div></div>
    <div class="card2"><div class="flex flex-wrap gap-1 mb-1">${Array.from({ length: Math.min(12, m.pres) }, () => '<i data-lucide="home" class="w-4 h-4"></i>').join('') || '<span class="text-xs opacity-70">No cottages yet.</span>'}</div><div class="text-[11.5px] opacity-70">One cottage per season. It does nothing, same as reviewers say of the original.</div></div>`;
  return card + sec('heir', 'Heirlooms', heirBody, true) + sec('farm', 'Farms', farmBody, false) + sec('seeds', 'Seed pool', seedBody, false) + sec('more', 'Patches and village', moreBody, false);
}

/* ---------- panels: Menu (Stats, Trophies, Settings, Lab) ---------- */
function sparkline() {
  const all = HIST.toArray(), a = all.slice(-60), off = all.length - a.length;
  if (a.length < 2) return '<div class="text-xs opacity-70">Play two days to see your income chart.</div>';
  const W = 300, H = 80, pad = 6, mx = Math.max(...a, 1), X = i => pad + i / (a.length - 1) * (W - 2 * pad), Y = v => H - pad - v / mx * (H - 2 * pad);
  const pts = a.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' '), best = maxSubD(a.slice(1).map((v, i) => v - a[i]));
  const band = best.sum > 0 ? `<rect x="${X(best.lo).toFixed(1)}" y="0" width="${(X(best.hi + 1) - X(best.lo)).toFixed(1)}" height="${H}" fill="var(--gold-soft)"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full" role="img" aria-label="Income per day">${band}<polygon points="${pad},${H - pad} ${pts} ${X(a.length - 1).toFixed(1)},${H - pad}" fill="var(--leaf-soft)"/><polyline points="${pts}" fill="none" stroke="var(--leaf)" stroke-width="2" stroke-linejoin="round"/><circle cx="${X(a.length - 1).toFixed(1)}" cy="${Y(a[a.length - 1]).toFixed(1)}" r="3.5" fill="var(--leaf)"/></svg>
    <div class="text-[11.5px] opacity-80">${best.sum > 0 ? `Strongest growth streak (divide and conquer): days ${off + best.lo + 2} to ${off + best.hi + 2}, +$${fmt(best.sum)} per day gained.` : 'No growth streak yet.'}</div>`;
}
function renderStats() {
  const L = G.meta.life, m = G.meta;
  const kv = [['Day', G.run.day], ['Money this run', '$' + fmt(G.run.moneyRun)], ['Best day', '$' + fmt(L.bestDay)], ['Crops (run)', fmt(G.run.harvRun)], ['Crops (lifetime)', fmt(L.harv)], ['Respawns', fmt(L.resp)], ['Machine waterings', fmt(L.auto)], ['Seasons', m.pres], ['Diamonds earned', L.diaEarn], ['Days played', L.days]];
  return `<div class="grid grid-cols-2 gap-2 mb-3">${kv.map(([k, v]) => `<div class="card2"><div class="text-[11px] opacity-70">${k}</div><div class="px text-sm">${v}</div></div>`).join('')}</div>
    <div class="px text-sm mb-1.5">Income per day</div><div class="card2">${sparkline()}</div>`;
}
function renderTrophies() {
  const m = G.meta;

    return `<div class="ach ${got ? 'got' : ''}"><i data-lucide="${got ? 'trophy' : 'lock'}" class="w-3.5 h-3.5 shrink-0"></i><div class="min-w-0"><div class="px text-[12.5px]">${got || !a.hidden ? a.name : '???'}</div><div class="text-[11px] opacity-75 leading-snug">${got || !a.hidden ? a.desc : 'Hidden achievement'}</div></div></div>`; }).join('')}</div>`;
}
function renderSettings() {
  const set = G.meta.set;

      if (tp.done && tp.done()) { markSeen(tp.id); continue; }
      COACH.tip = tp; COACH.since = now; $('#coachTx').textContent = tp.text; $('#coach').classList.add('on'); placeCoach(tp.at() || anStage()); break;
    }
  }
}
function replayTips() {
  TIPS.forEach(t => { delete ui().seen[t.id]; }); COACHB.water = lf().water; COACHB.harv = lf().harv; COACHB.nodes = G.run.nodes.length; coachHide(); save();
}

/* ---------- toasts, day-end modal ---------- */
const TQ = new Queue(); let toastLive = 0;            // FIFO: toasts show in the order they were raised, three at a time
function pumpToasts() {
  while (toastLive < 3 && TQ.size) {
    const html = TQ.dequeue(), d = document.createElement('div'); d.className = 'toast'; d.innerHTML = html; $('#toasts').appendChild(d); toastLive++; icons();
    setTimeout(() => { d.remove(); toastLive--; pumpToasts(); }, 3200);
  }
}
function toast(html) { TQ.enqueue(html); pumpToasts(); }
HOOK.ach = a => { toast(`<i data-lucide="trophy" class="w-4 h-4"></i><div><div class="px text-sm">${esc(a.name)}</div><div class="text-[11.5px] opacity-80">${esc(a.desc)}</div></div>`); AUD.sfx('ach'); if (tab === 'menu' && menuSec === 'trophies') renderPanel(); };
HOOK.dia = d => { toast(`<i data-lucide="gem" class="w-4 h-4"></i><div class="px text-sm">Diamond ${d} reached</div>`); AUD.sfx('dia'); };
HOOK.dayEnd = res => { AUD.sfx('dayEnd'); AUD.duck(true); showResults(res); renderPanel(); hud(); };
let RV = 0, CURRES = null;
const cancelReveal = () => { if (RV) { cancelAnimationFrame(RV); RV = 0; } };
function finishReveal(res) {
  document.querySelectorAll('#modalBody .rowrv').forEach(r => r.classList.add('in'));
  document.querySelectorAll('#modalBody .cu').forEach((c, i) => { c.textContent = '$' + fmt(res.lines[i].earn); });
  const t = $('#mTotal'); if (t) { t.classList.add('in'); $('#mTotalN').textContent = fmt(res.earn); } const s = $('#mStamp'); if (s) s.hidden = false;
}
function revealResults(res) {                           // rows appear one by one with a count-up, then the total pops, then the stamp
  cancelReveal();
  const rows = [...document.querySelectorAll('#modalBody .rowrv')], cu = [...document.querySelectorAll('#modalBody .cu')], tot = $('#mTotal'), totN = $('#mTotalN'), stamp = $('#mStamp');
  if (RM.matches) { finishReveal(res); return; }
  const t0 = performance.now(), STEP = 300, DUR = 380, tEnd = rows.length * STEP + DUR; let totalShown = false, stampShown = false;
  const ease = k => 1 - Math.pow(1 - k, 3);
  const loop = now => {
    const el = now - t0;
    rows.forEach((r, i) => { const s = el - i * STEP; if (s < 0) return; if (!r.classList.contains('in')) { r.classList.add('in'); AUD.sfx('tally', i); } cu[i].textContent = '$' + fmt(res.lines[i].earn * ease(Math.min(1, s / DUR))); });
    if (el >= tEnd) {
      if (!totalShown) { totalShown = true; tot.classList.add('in'); AUD.sfx('total'); }
      const k = Math.min(1, (el - tEnd) / 450); totN.textContent = fmt(res.earn * ease(k));
      if (k >= 1 && stamp && !stampShown) { stampShown = true; stamp.hidden = false; AUD.sfx('best'); }
      if (k >= 1 && (!stamp || stampShown)) { RV = 0; return; }
    }
    RV = requestAnimationFrame(loop);
  };
  RV = requestAnimationFrame(loop);
}
function showResults(res) {
  CURRES = res;
  const best = res.earn > res.prevBest && G.meta.life.days > 1 && res.earn > 0;
  const rows = res.lines.map(l => `<tr class="rowrv"><td>${SRCN[l.src] || l.src}</td><td class="r">${l.count ? l.count + ' crops' : ''}</td><td class="r px"><span class="cu">$0</span></td></tr>`).join('') || '<tr><td colspan="3" class="opacity-70">No harvests today. Move the ring over the crops.</td></tr>';
  const crews = Object.entries(res.harv).map(([k, v]) => `${HARVN[k]} ${v}`).join(' · ') || 'none';
  const nt = nextTarget();
  $('#modalBody').innerHTML = `<div class="px text-lg mb-1">Day ${res.day} complete</div>
    <table class="w-full text-sm mb-2"><tbody>${rows}</tbody></table>
    <div class="flex items-center mb-2"><span class="px text-sm opacity-70 mr-2">Total</span><span class="px text-2xl tot" id="mTotal" style="color:var(--gold)">+$<span id="mTotalN">0</span></span>${best ? '<span class="stamp" id="mStamp" hidden>New best!</span>' : ''}</div>
    <div class="text-[11.5px] opacity-80 mb-1">Harvested by: ${crews}</div>
    ${res.patch > .5 ? `<div class="text-[11.5px] opacity-80 mb-2">Patch bonus included in the totals: +$${fmt(res.patch)}</div>` : '<div class="mb-2"></div>'}
    ${res.auto && res.auto.length ? `<div class="note mb-3"><i data-lucide="zap" class="w-3.5 h-3.5"></i> Auto-bought: ${res.auto.map(esc).join(', ')}</div>` : ''}
    ${nt ? `<div class="note mb-3"><i data-lucide="target" class="w-3.5 h-3.5"></i> Next: <b>${esc(nt.name)}</b> costs $${fmt(nt.cost)}${G.run.money >= nt.cost ? ' (you can afford it)' : ', you have $' + fmt(G.run.money)}</div>` : ''}
    ${G.run.dia >= FARMS[G.run.farm].cap ? '<div class="note mb-3 gold-note"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Diamond cap reached. More days add nothing; prestige from the Prestige tab.</div>' : ''}
    <div class="flex gap-2"><button id="mUp" class="btn grow"><i data-lucide="sprout" class="w-4 h-4"></i> Upgrades</button><button id="mNext" class="btn go grow"><i data-lucide="play" class="w-4 h-4"></i> Next day</button></div>`;
  $('#modal').hidden = false; icons(); revealResults(res);
  setTimeout(() => { const b = $('#mNext'); if (b && !$('#modal').hidden) b.focus({ preventScroll: true }); }, 0);
  clearTimeout(autoT);
  if (G.meta.set.auto) autoT = setTimeout(() => { if (S.phase === 'results' && !$('#modal').hidden) { closeModal(); startDay(); } }, 2600 + res.lines.length * 300 + 800);
}
const closeModal = () => { clearTimeout(autoT); cancelReveal(); if (!$('#modal').hidden) { $('#modal').hidden = true; AUD.duck(false); } };

/* ---------- Pyodide (Python economy) ---------- */
const PY_TIMEOUT = 25000;
async function bootPython() {
  try {
    if (typeof loadPyodide !== 'function') throw new Error('Pyodide script did not load');
    const py = await Promise.race([loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/npm/pyodide@0.26.4/' }), new Promise((_, rej) => setTimeout(() => rej(new Error('timed out')), PY_TIMEOUT))]);
    py.runPython(PY_SRC);
    const costs = py.globals.get('build_costs')().toJs(), jsCosts = Econ.costs();
    const bad = costs.length !== 100 ? 100 : costs.filter((c, i) => Math.abs(c - jsCosts[i]) > 1e-9 * Math.max(1, c)).length;
    if (bad) throw new Error(bad + ' cost mismatches');
    const settle = py.globals.get('settle_day'), dfor = py.globals.get('diamonds_for'), js = Econ.settleDay;
    Econ.settleDay = d => { try { return JSON.parse(settle(JSON.stringify(d))); } catch (e) { return js(d); } };
    PYF = { dfor }; PY.py = py; PY.ready = true; PY.note = 'Python: ready, 100 node costs verified';
  } catch (e) { PY.note = 'Python: unavailable here (' + String(e.message || e).slice(0, 60) + '), using the JavaScript copy of the same economy'; }
  hud(); renderPanel();
}
async function runLab() {
  const out = $('#labOut'); if (!out) return;
  if (!PY.ready) { out.textContent = 'Python is not loaded in this view, so the lab is off. The game itself still runs on the JavaScript economy.'; return; }
  const buf = []; PY.py.setStdout({ batched: s => buf.push(s) }); PY.py.setStderr({ batched: s => buf.push(s) });
  try { PY.py.globals.set('game', PY.py.toPy(snapshot())); await PY.py.runPythonAsync($('#labCode').value); }
  catch (e) { buf.push(String(e.message || e).trim().split('\n').slice(-3).join('\n')); }
  out.textContent = buf.join('\n') || '(no output)';
}

/* ---------- events ---------- */
function act(name, el) {
  const id = el.dataset.id, v = el.dataset.v; let r;
  const say = x => { if (x && !x.ok) { toast(`<i data-lucide="info" class="w-4 h-4"></i><div class="text-sm">${esc(x.msg)}</div>`); AUD.sfx('deny'); } return x; };
  if (name === 'buy') say(buyNode(id));
  else if (name === 'heir') say(buyHeir(id));
  else if (name === 'filt') { filt = v; ui().all = 1; } else if (name === 'stat') { stat = v; ui().all = 1; } else if (name === 'view') { view = v; ui().all = 1; }
  else if (name === 'showall') { ui().all = ui().all ? 0 : 1; save(); }
  else if (name === 'undo') say(undoBuy());
  else if (name === 'route') plan = plan && plan.id === id ? null : { id };
  else if (name === 'clearplan') plan = null;
  else if (name === 'buyroute') { if (plan && S.phase !== 'day') buyRoute(routeTo(plan.id).ids); }
  else if (name === 'bundle') { if (S.phase !== 'day') bestUpgradeBundle().nodes.forEach(n => buyNode(n.id)); }
  else if (name === 'heirbundle') bestHeirBundle().ids.forEach(hid => buyHeir(hid));
  else if (name === 'skip') say(toggleSkip(id));
  else if (name === 'labsort') lab.sort = null;
  else if (name === 'farm') setPend(id);
  else if (name === 'cancel') conf = {};
  else if (name === 'msec') menuSec = v;
  else if (name === 'back') tab = 'skills';
  else if (name === 'replay') { replayTips(); tab = 'skills'; toast('<i data-lucide="graduation-cap" class="w-4 h-4"></i><div class="text-sm">Tutorial restarted. Press Play and follow the tips.</div>'); }
  else if (name === 'prestige') { if (!conf.pres) { conf = { pres: 1 }; } else { conf = {}; r = prestige(); if (r.ok) { fxReset(); layout(); closeModal(); toast(`<i data-lucide="sparkles" class="w-4 h-4"></i><div class="px text-sm">Season ${G.meta.pres} complete, +${r.msg} ◆</div>`); } } }
  else if (name === 'reset') { if (!conf.reset) conf = { reset: 1 }; else { conf = {}; wipe(); fxReset(); layout(); closeModal(); tab = 'skills'; menuSec = 'stats'; hl = null; plan = null; COACHB.water = 0; COACHB.harv = 0; COACHB.nodes = 0; coachHide(); gateKey = ''; } }
  else if (name === 'lab') { runLab(); return; }
  renderPanel(); hud();
}
$('#panelBody').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act, b); });
$('#tabsNav').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; conf = {}; renderPanel(); } });
$('#btnMenu').addEventListener('click', () => { tab = 'menu'; conf = {}; if (MOBILE.matches) sheet(true); renderPanel(); });
$('#btnMute').addEventListener('click', () => { const s = G.meta.set; s.mute = s.mute ? 0 : 1; save(); AUD.unlock(); AUD.vols(); muteUI(); if (tab === 'menu' && menuSec === 'settings') renderPanel(); });
document.addEventListener('click', e => { if (e.target.closest('.goal')) openUpgrades(true); });
$('#coachX').addEventListener('click', () => { if (COACH.tip) markSeen(COACH.tip.id); coachHide(); });
$('#panelBody').addEventListener('input', e => {
  const t = e.target; if (t.id === 'labCode') { labSrc = t.value; return; }
  const k = t.dataset && t.dataset.set; if (!k) return;
  G.meta.set[k] = t.type === 'checkbox' ? (t.checked ? 1 : 0) : Number(t.value); save();
  if (k === 'music' || k === 'sfx' || k === 'mute') { AUD.unlock(); AUD.vols(); muteUI(); }
  if (k === 'auto') $('#chkAuto').checked = !!G.meta.set.auto; if (k === 'greedy') $('#chkGreedy').checked = !!G.meta.set.greedy;
});
$('#panelBody').addEventListener('change', e => {
  const t = e.target, u = t.dataset && t.dataset.ui, lb = t.dataset && t.dataset.lab;
  if (u === 'sortK') { sortK = t.value; ui().all = 1; save(); renderPanel(); }
  else if (lb) { lab[lb] = lb === 'n' || lb === 'idx' ? Number(t.value) : t.value; if (lb !== 'idx') lab.sort = null; renderPanel(); }
});
$('#panelBody').addEventListener('toggle', e => {                       // remember which sections the player opened or closed
  const d = e.target, id = d.dataset && d.dataset.sec; if (!id) return;
  if (id === 'adv') { if (d.open !== advOpen()) { ui().adv = d.open ? 1 : 0; save(); } } else secOpen[id] = d.open;
}, true);
function play() { AUD.unlock(); if (S.paused) { S.paused = false; return; } closeModal(); startDay(); hud(); }
$('#overlay').addEventListener('click', play); $('#btnPlay').addEventListener('click', play);
$('#modal').addEventListener('click', e => {
  if (RV) { cancelReveal(); if (CURRES) finishReveal(CURRES); }
  if (e.target.closest('#mNext')) { closeModal(); startDay(); hud(); }
  else if (e.target.closest('#mUp')) { closeModal(); openUpgrades(false); hud(); }
});
$('#btnSpeed').addEventListener('click', () => { const s = G.meta.set; s.speed = s.speed >= 4 ? 1 : s.speed * 2; save(); hud(); });
$('#chkAuto').addEventListener('change', e => { G.meta.set.auto = e.target.checked ? 1 : 0; save(); });
$('#chkGreedy').addEventListener('change', e => { G.meta.set.greedy = e.target.checked ? 1 : 0; save(); });
function ptr(e) { const r = cv.getBoundingClientRect(), [gx, gy] = s2w(e.clientX - r.left, e.clientY - r.top); S.mx = gx; S.my = gy; S.mouse = true; if (!S.moved) { S.rx = gx; S.ry = gy; S.moved = 1; } }
cv.addEventListener('pointermove', ptr); cv.addEventListener('pointerdown', e => { try { cv.setPointerCapture(e.pointerId); } catch (x) {} ptr(e); });
cv.addEventListener('pointerleave', () => { S.mouse = false; }); cv.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') S.mouse = false; });
const pauseNow = () => { if (S.phase === 'day') S.paused = true; };
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseNow(); AUD.vis(!document.hidden); }); window.addEventListener('blur', pauseNow);
window.addEventListener('resize', () => { layout(); });
$('#chkAuto').checked = !!G.meta.set.auto; $('#chkGreedy').checked = !!G.meta.set.greedy;
/* audio unlock + subtle UI sounds */
['pointerdown', 'keydown', 'touchend'].forEach(ev => window.addEventListener(ev, () => AUD.unlock(), { capture: true }));
let lastHover = null;
document.addEventListener('pointerover', e => { if (e.pointerType !== 'mouse') return; const el = e.target.closest && e.target.closest('.btn,.tab,.chip,.goal,.rt,.seg button,summary'); if (el && el !== lastHover) { lastHover = el; AUD.sfx('hover'); } else if (!el) lastHover = null; });
document.addEventListener('pointerdown', e => { const el = e.target.closest && e.target.closest('button,summary,.goal'); if (el && !el.closest('#cv') && !el.matches('[data-act="buy"],[data-act="heir"]')) AUD.sfx('click'); });
/* mobile bottom sheet: tap the handle, or drag it up or down */
let dragY = null, swiped = false;
$('#sheetHandle').addEventListener('pointerdown', e => { dragY = e.clientY; swiped = false; });
window.addEventListener('pointerup', e => { if (dragY === null) return; const dy = e.clientY - dragY; dragY = null; if (Math.abs(dy) >= 24) { swiped = true; sheet(dy < 0); } });
$('#sheetHandle').addEventListener('click', () => { if (swiped) { swiped = false; return; } sheet(!$('#panel').classList.contains('open')); });
$('#goalD').innerHTML = goalHTML(); $('#goalM').innerHTML = goalHTML();

/* ---------- main loop ---------- */
let last = performance.now(), accSave = 0, liveT = 0, gateKey = '';
function fxFrame(dt, now) {
  const fdt = S.paused ? 0 : dt;
  FX.step(fdt, fxStep); COIN.step(fdt, coinStep);
  if (coinArrived) { coinArrived = 0; if (!RM.matches) { const c = $('#chipMoney'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); } }
  if (shake > 0) shake = Math.max(0, shake - dt);
  combo.t = Math.max(0, combo.t - fdt * (G.meta.set.speed || 1));
  const tg = Math.max(0, G.run.money - coinInFlight);                    // the Money chip ticks up as the coins arrive
  if (RM.matches || tg < shownMoney) shownMoney = tg; else shownMoney += (tg - shownMoney) * Math.min(1, dt * 12); if (Math.abs(tg - shownMoney) < .01) shownMoney = tg;
  const cb = $('#combo'), show = combo.n >= 2 && combo.t > 0;
  if (show) { if (combo.shown !== combo.n) { combo.shown = combo.n; cb.textContent = '×' + combo.n + ' combo'; if (!RM.matches) { cb.classList.remove('pop'); void cb.offsetWidth; cb.classList.add('pop'); } } cb.style.opacity = Math.min(1, combo.t / .4).toFixed(2); }
  else if (hc.cbo !== 0) { hc.cbo = 0; cb.style.opacity = 0; combo.shown = 0; }
  if (show) hc.cbo = 1;
  drawCoins();
}
function liveCheck(now) {                                               // unlock gates and card affordability, a few times a second
  if (now - liveT < 300) return; liveT = now;
  const key = [prestigeUnlocked(), afterPrestige(), advAuto()].join();
  if (key !== gateKey) { const first = gateKey === ''; gateKey = key; if (!first) renderPanel(); }
  if (tab !== 'skills') return;
  let dirty = false;
  document.querySelectorAll('#panelBody .ucard').forEach(el => {
    const n = NODE[el.dataset.id]; if (!n) return; const st = NST(n);
    if (st !== el.dataset.st) dirty = true; else if (st === 'poor') { const i = el.querySelector('.pbar i'); if (i) i.style.width = Math.min(100, G.run.money / n.cost * 100).toFixed(1) + '%'; }
  });
  if (dirty) renderPanel();
}
function frame(now) {
  requestAnimationFrame(frame);
  const lim = G.meta.set.fps; if (lim && now - last < 1000 / lim - 1) return;
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (!S.paused) { tick(dt); accSave += dt; if (accSave > 15) { accSave = 0; save(); } }
  fxFrame(dt, now); drawScene(now / 1000); hud(); goalUpdate(now); coachTick(now); liveCheck(now); AUD.frame(dt);
}
shownMoney = G.run.money; layout(); renderPanel(); hud(); icons(); checkAch();
requestAnimationFrame(frame);
window.addEventListener('load', () => setTimeout(bootPython, 50));
window.addEventListener('pagehide', save);

</script>
